<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Classroom Chalkboard Theme Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F4C3A" />
    </linearGradient>

    <!-- Chalk Glow Filter -->
    <filter id="chalkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background: Classroom Board Frame -->
  <rect width="800" height="500" rx="16" fill="#27272A" />
  <rect x="20" y="20" width="760" height="460" rx="10" fill="url(#bgGrad3)" stroke="#71717A" stroke-width="6" />

  <!-- Wooden Chalk Tray at bottom -->
  <rect x="40" y="468" width="720" height="12" fill="#78350F" rx="3" />

  <!-- Grid Lines on Blackboard (Subtle) -->
  <g opacity="0.08" stroke="#FFF" stroke-width="1">
    <line x1="100" y1="20" x2="100" y2="480" />
    <line x1="200" y1="20" x2="200" y2="480" />
    <line x1="300" y1="20" x2="300" y2="480" />
    <line x1="400" y1="20" x2="400" y2="480" />
    <line x1="500" y1="20" x2="500" y2="480" />
    <line x1="600" y1="20" x2="600" y2="480" />
    <line x1="700" y1="20" x2="700" y2="480" />
    <line x1="20" y1="100" x2="780" y2="100" />
    <line x1="20" y1="200" x2="780" y2="200" />
    <line x1="20" y1="300" x2="780" y2="300" />
    <line x1="20" y1="400" x2="780" y2="400" />
  </g>

  <!-- CENTRAL DIAGRAM: SQUARE WITH EXTENDED EXTERIOR SIDES -->
  <!-- Square Center at (400, 210), side length = 160 -->
  <!-- Corners:
       Top-Left (TL): (320, 130)
       Top-Right (TR): (480, 130)
       Bottom-Right (BR): (480, 290)
       Bottom-Left (BL): (320, 290)
  -->
  <g filter="url(#shadow3)">
    <!-- Extended Vector Side Lines (Exterior Paths) -->
    <!-- Bottom line extended Right -->
    <line x1="250" y1="290" x2="570" y2="290" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <polygon points="570,290 555,283 555,297" fill="#34D399" />

    <!-- Right line extended Up -->
    <line x1="480" y1="360" x2="480" y2="60" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <polygon points="480,60 473,75 487,75" fill="#34D399" />

    <!-- Top line extended Left -->
    <line x1="550" y1="130" x2="230" y2="130" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <polygon points="230,130 245,123 245,137" fill="#34D399" />

    <!-- Left line extended Down -->
    <line x1="320" y1="60" x2="320" y2="360" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
    <polygon points="320,360 313,345 327,345" fill="#34D399" />

    <!-- Main Square Polygon (n=4) -->
    <polygon points="320,130 480,130 480,290 320,290" fill="#10B981" opacity="0.3" stroke="#FBBF24" stroke-width="4" />

    <!-- EXTERIOR ANGLE TURN ARCS (90° Turns) -->
    <!-- Bottom Right Turn (480, 290) -->
    <path d="M 515,290 A 35 35 0 0 0 480,255" fill="none" stroke="#F43F5E" stroke-width="3.5" filter="url(#chalkGlow)" />
    <text x="525" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#F43F5E">90° turn</text>

    <!-- Top Right Turn (480, 130) -->
    <path d="M 480,95 A 35 35 0 0 0 445,130" fill="none" stroke="#F43F5E" stroke-width="3.5" filter="url(#chalkGlow)" />
    <text x="495" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#F43F5E">90° turn</text>

    <!-- Top Left Turn (320, 130) -->
    <path d="M 285,130 A 35 35 0 0 0 320,165" fill="none" stroke="#F43F5E" stroke-width="3.5" filter="url(#chalkGlow)" />
    <text x="235" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#F43F5E">90° turn</text>

    <!-- Bottom Left Turn (320, 290) -->
    <path d="M 320,325 A 35 35 0 0 0 355,290" fill="none" stroke="#F43F5E" stroke-width="3.5" filter="url(#chalkGlow)" />
    <text x="255" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#F43F5E">90° turn</text>
  </g>

  <!-- Full Circle Rotation Arrow Overlay in Center -->
  <g transform="translate(400, 210)" filter="url(#chalkGlow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FACC15" stroke-width="3" stroke-dasharray="6 4" />
    <polygon points="45,0 35,-10 35,10" fill="#FACC15" />
    <text x="0" y="-5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FACC15" text-anchor="middle">FULL CIRCLE</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFF" text-anchor="middle">360°</text>
  </g>

  <!-- Left Blackboard Chalk Box: Exterior Sum Rule -->
  <g transform="translate(120, 160)" filter="url(#shadow3)">
    <rect x="-85" y="-70" width="170" height="140" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">EXTERIOR RULE</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Sum of Exterior</text>
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Angles is ALWAYS</text>
    <line x1="-60" y1="14" x2="60" y2="14" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FACC15" text-anchor="middle">360°</text>
  </g>

  <!-- Right Blackboard Chalk Box: Exterior Angle Formula -->
  <g transform="translate(680, 160)" filter="url(#shadow3)">
    <rect x="-85" y="-70" width="170" height="140" rx="12" fill="#0F172A" stroke="#F43F5E" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F43F5E" text-anchor="middle">FORMULA</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFF" text-anchor="middle">Each Exterior Angle</text>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FACC15" text-anchor="middle">= 360° ÷ n</text>
    <line x1="-60" y1="18" x2="60" y2="18" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">Square (n=4):</text>
    <text x="0" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#F43F5E" text-anchor="middle">360° ÷ 4 = 90°</text>
  </g>

  <!-- Teacher Character on Right holding chalk pointer -->
  <g transform="translate(640, 310)" filter="url(#shadow3)">
    <!-- Teacher Avatar -->
    <circle cx="40" cy="35" r="22" fill="#64748B" />
    <circle cx="40" cy="38" r="18" fill="#FED7AA" />
    <circle cx="34" cy="36" r="2.5" fill="#0F172A" />
    <circle cx="46" cy="36" r="2.5" fill="#0F172A" />
    <path d="M 35,45 Q 40,50 45,45" stroke="#9A3412" stroke-width="2" fill="none" />
    <!-- Glasses -->
    <rect x="28" y="31" width="10" height="8" rx="2" fill="none" stroke="#0F172A" stroke-width="1.5" />
    <rect x="42" y="31" width="10" height="8" rx="2" fill="none" stroke="#0F172A" stroke-width="1.5" />
    <line x1="38" y1="35" x2="42" y2="35" stroke="#0F172A" opacity="0.8" />
    <path d="M 15,100 L 25,58 Q 40,56 55,58 L 65,100 Z" fill="#047857" />
    <!-- Pointer Stick -->
    <line x1="20" y1="65" x2="-80" y2="-40" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Bottom Informational Banner Card -->
  <g transform="translate(400, 445)" filter="url(#shadow3)">
    <rect x="-270" y="-30" width="540" height="56" rx="28" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <text x="0" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle">✨ THE EXTERNAL ANGLE TRICK ✨</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#F3F4F6" text-anchor="middle">Walking around ANY polygon equals 1 full circle turn (360°)!</text>
  </g>
</svg>
