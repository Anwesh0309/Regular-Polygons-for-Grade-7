<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Sunset Street Scene -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Stop Sign Red Gradient -->
    <linearGradient id="stopRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Glowing Cyan Triangulation Line Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)" />

  <!-- Street Corner Background Elements -->
  <!-- Sidewalk / Road -->
  <path d="M 0,420 L 800,420 L 800,500 L 0,500 Z" fill="#334155" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#FBBF24" stroke-width="4" stroke-dasharray="20 15" />

  <!-- Distant City Silhouettes -->
  <path d="M 50,420 L 50,300 L 110,300 L 110,420 M 150,420 L 150,260 L 220,260 L 220,420 M 600,420 L 600,280 L 670,280 L 670,420 M 700,420 L 700,320 L 750,320 L 750,420" fill="#1E1B4B" opacity="0.6" />

  <!-- Stop Sign Pole -->
  <rect x="390" y="240" width="20" height="200" fill="#94A3B8" rx="4" />
  <rect x="395" y="240" width="5" height="200" fill="#E2E8F0" />

  <!-- MAIN STOP SIGN (Regular Octagon n=8) -->
  <!-- Octagon Vertices around center (400, 160) radius = 130 -->
  <!-- Vertices:
       V0: (400, 30)
       V1: (492, 68)
       V2: (530, 160)
       V3: (492, 252)
       V4: (400, 290)
       V5: (308, 252)
       V6: (270, 160)
       V7: (308, 68)
  -->
  <g filter="url(#shadow1)">
    <!-- Outer White Border -->
    <polygon points="400,24 496,64 536,160 496,256 400,296 304,256 264,160 304,64" fill="#FFFFFF" />
    <!-- Red Sign Body -->
    <polygon points="400,30 492,68 530,160 492,252 400,290 308,252 270,160 308,68" fill="url(#stopRed)" stroke="#B91C1C" stroke-width="2" />

    <!-- STOP Text -->
    <text x="400" y="178" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" opacity="0.95">STOP</text>

    <!-- TRIANGULATION OVERLAY FROM VERTEX V6 (270, 160) -->
    <!-- Diagonals to V0, V1, V2, V3, V4 -->
    <g stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4" filter="url(#cyanGlow)">
      <line x1="270" y1="160" x2="400" y2="30" /> <!-- V6 to V0 -->
      <line x1="270" y1="160" x2="492" y2="68" /> <!-- V6 to V1 -->
      <line x1="270" y1="160" x2="530" y2="160" /> <!-- V6 to V2 -->
      <line x1="270" y1="160" x2="492" y2="252" /> <!-- V6 to V3 -->
      <line x1="270" y1="160" x2="400" y2="290" /> <!-- V6 to V4 -->
    </g>

    <!-- Vertex Highlight Dots -->
    <circle cx="270" cy="160" r="9" fill="#FACC15" stroke="#000" stroke-width="2" /> <!-- Origin Vertex -->
    <circle cx="400" cy="30" r="5" fill="#38BDF8" />
    <circle cx="492" cy="68" r="5" fill="#38BDF8" />
    <circle cx="530" cy="160" r="5" fill="#38BDF8" />
    <circle cx="492" cy="252" r="5" fill="#38BDF8" />
    <circle cx="400" cy="290" r="5" fill="#38BDF8" />
    <circle cx="308" cy="252" r="5" fill="#38BDF8" />
    <circle cx="308" cy="68" r="5" fill="#38BDF8" />

    <!-- Triangle Labels (T1 to T6) -->
    <g font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FACC15" text-anchor="middle">
      <text x="325" y="85">△1</text>
      <text x="375" y="70">△2</text>
      <text x="435" y="95">△3</text>
      <text x="445" y="160">△4</text>
      <text x="425" y="225">△5</text>
      <text x="345" y="235">△6</text>
    </g>
  </g>

  <!-- Left Callout Box: Formula Breakdown -->
  <g transform="translate(110, 160)" filter="url(#shadow1)">
    <rect x="-90" y="-70" width="180" height="140" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">TRIANGULATION</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFF" text-anchor="middle">n = 8 sides</text>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FACC15" text-anchor="middle">8 − 2 = 6 Triangles</text>
    <line x1="-70" y1="18" x2="70" y2="18" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">6 × 180° =</text>
    <text x="0" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#4ADE80" text-anchor="middle">1080° TOTAL</text>
  </g>

  <!-- Right Callout Box: Interior Angle Calculation -->
  <g transform="translate(690, 160)" filter="url(#shadow1)">
    <rect x="-85" y="-70" width="170" height="140" rx="14" fill="#0F172A" stroke="#EC4899" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#EC4899" text-anchor="middle">EACH ANGLE</text>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFF" text-anchor="middle">Angle Sum ÷ n</text>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FACC15" text-anchor="middle">1080° ÷ 8</text>
    <line x1="-65" y1="20" x2="65" y2="20" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#EC4899" text-anchor="middle">135°</text>
  </g>

  <!-- Character Arjun (Left Pointing Up) -->
  <g transform="translate(180, 310)" filter="url(#shadow1)">
    <!-- Head -->
    <circle cx="40" cy="40" r="22" fill="#FED7AA" />
    <!-- Hair -->
    <path d="M 18,22 Q 40,8 62,22 Q 55,8 40,6 Q 25,8 18,22 Z" fill="#0F172A" />
    <!-- Eyes -->
    <circle cx="34" cy="38" r="3" fill="#0F172A" />
    <circle cx="48" cy="38" r="3" fill="#0F172A" />
    <!-- Smile -->
    <path d="M 35,48 Q 40,54 45,48" stroke="#9A3412" stroke-width="2" fill="none" />
    <!-- Body -->
    <path d="M 15,110 L 25,65 Q 40,63 55,65 L 65,110 Z" fill="#3B82F6" />
    <!-- Arm pointing up at sign -->
    <line x1="55" y1="70" x2="90" y2="25" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" />
    <circle cx="92" cy="23" r="6" fill="#FED7AA" />
  </g>

  <!-- Character Maya (Right looking up with notebook) -->
  <g transform="translate(560, 310)" filter="url(#shadow1)">
    <!-- Hair -->
    <circle cx="40" cy="35" r="26" fill="#334155" />
    <!-- Head -->
    <circle cx="40" cy="40" r="22" fill="#FDBA74" />
    <circle cx="34" cy="38" r="3" fill="#1E293B" />
    <circle cx="48" cy="38" r="3" fill="#1E293B" />
    <path d="M 35,48 Q 40,54 45,48" stroke="#9A3412" stroke-width="2" fill="none" />
    <!-- Body -->
    <path d="M 15,110 L 25,65 Q 40,63 55,65 L 65,110 Z" fill="#EC4899" />
    <!-- Notebook held -->
    <rect x="5" y="60" width="30" height="40" rx="4" fill="#FFF" stroke="#64748B" stroke-width="2" transform="rotate(-15 20 80)" />
    <line x1="12" y1="70" x2="28" y2="66" stroke="#38BDF8" stroke-width="2" />
    <line x1="14" y1="78" x2="30" y2="74" stroke="#EC4899" stroke-width="2" />
  </g>

  <!-- Bottom Informational Banner Card -->
  <g transform="translate(400, 445)" filter="url(#shadow1)">
    <rect x="-280" y="-30" width="560" height="56" rx="28" fill="#1E1B4B" stroke="#EC4899" stroke-width="2" />
    <text x="0" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#EC4899" text-anchor="middle">✨ THE INTERIOR ANGLE SUM FORMULA ✨</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#F3F4F6" text-anchor="middle">Interior Angle Sum = (n − 2) × 180°  |  For Octagon: 6 × 180° = 1080°</text>
  </g>
</svg>
