<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Vibrant Sunny Park -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Flowerbed Soil / Grass Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <radialGradient id="parkSun" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)" />
  <circle cx="400" cy="200" r="350" fill="url(#parkSun)" />

  <!-- Park Hill Landscape -->
  <path d="M 0,380 Q 200,320 400,350 Q 600,380 800,330 L 800,500 L 0,500 Z" fill="url(#grassGrad)" />

  <!-- Park Trees Silhouettes -->
  <g opacity="0.4" fill="#064E3B">
    <circle cx="90" cy="280" r="45" />
    <rect x="83" y="310" width="14" height="60" fill="#14532D" />
    <circle cx="710" cy="270" r="55" />
    <rect x="702" y="300" width="16" height="70" fill="#14532D" />
  </g>

  <!-- PENTAGON FLOWERBED (n=5) -->
  <!-- Center at (400, 240), radius = 140 -->
  <!-- Pentagon Vertices (standard top-pointing):
       V0: (400, 100)
       V1: (533, 197)
       V2: (482, 353)
       V3: (318, 353)
       V4: (267, 197)
  -->
  <g filter="url(#shadow2)">
    <!-- Flower Bed Stone Border -->
    <polygon points="400,90 543,192 490,363 310,363 257,192" fill="#78716C" stroke="#E7E5E4" stroke-width="4" />
    <!-- Garden Soil -->
    <polygon points="400,100 533,197 482,353 318,353 267,197" fill="#451A03" stroke="#A855F7" stroke-width="3" />

    <!-- Blooming Flowers inside Pentagon -->
    <!-- Center flowers -->
    <g transform="translate(400, 220)">
      <circle cx="0" cy="0" r="16" fill="#F43F5E" />
      <circle cx="-12" cy="-12" r="12" fill="#EC4899" />
      <circle cx="12" cy="-12" r="12" fill="#EC4899" />
      <circle cx="-12" cy="12" r="12" fill="#EC4899" />
      <circle cx="12" cy="12" r="12" fill="#EC4899" />
      <circle cx="0" cy="0" r="8" fill="#FDE047" />
    </g>

    <!-- Outer Pentagon Flowers near vertices -->
    <g fill="#A855F7">
      <circle cx="370" cy="140" r="10" />
      <circle cx="430" cy="140" r="10" />
      <circle cx="480" cy="220" r="10" fill="#3B82F6" />
      <circle cx="320" cy="220" r="10" fill="#3B82F6" />
      <circle cx="360" cy="320" r="10" fill="#F59E0B" />
      <circle cx="440" cy="320" r="10" fill="#F59E0B" />
    </g>

    <!-- GEOMETRIC ANGLE ANNOTATIONS (108° at each vertex) -->
    <!-- Vertex V0 (400, 100) -->
    <path d="M 378,116 A 25 25 0 0 0 422,116" fill="none" stroke="#C084FC" stroke-width="3" />
    <rect x="372" y="125" width="56" height="24" rx="6" fill="#0F172A" />
    <text x="400" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#C084FC" text-anchor="middle">108°</text>

    <!-- Vertex V1 (533, 197) -->
    <rect x="460" y="185" width="56" height="24" rx="6" fill="#0F172A" />
    <text x="488" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#C084FC" text-anchor="middle">108°</text>

    <!-- Vertex V2 (482, 353) -->
    <rect x="430" y="315" width="56" height="24" rx="6" fill="#0F172A" />
    <text x="458" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#C084FC" text-anchor="middle">108°</text>

    <!-- Vertex V3 (318, 353) -->
    <rect x="315" y="315" width="56" height="24" rx="6" fill="#0F172A" />
    <text x="343" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#C084FC" text-anchor="middle">108°</text>

    <!-- Vertex V4 (267, 197) -->
    <rect x="285" y="185" width="56" height="24" rx="6" fill="#0F172A" />
    <text x="313" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#C084FC" text-anchor="middle">108°</text>

    <!-- Side Equality Indicators -->
    <line x1="460" y1="140" x2="470" y2="155" stroke="#FDE047" stroke-width="3" />
    <line x1="500" y1="270" x2="515" y2="280" stroke="#FDE047" stroke-width="3" />
    <line x1="395" y1="345" x2="405" y2="360" stroke="#FDE047" stroke-width="3" />
    <line x1="285" y1="280" x2="300" y2="270" stroke="#FDE047" stroke-width="3" />
    <line x1="330" y1="155" x2="340" y2="140" stroke="#FDE047" stroke-width="3" />
  </g>

  <!-- Left Callout Box: Total Angle Calculation -->
  <g transform="translate(110, 160)" filter="url(#shadow2)">
    <rect x="-85" y="-70" width="170" height="140" rx="14" fill="#0F172A" stroke="#C084FC" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#C084FC" text-anchor="middle">PENTAGON</text>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFF" text-anchor="middle">n = 5 sides</text>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FDE047" text-anchor="middle">(5 − 2) × 180°</text>
    <line x1="-65" y1="18" x2="65" y2="18" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" text-anchor="middle">3 × 180° =</text>
    <text x="0" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#C084FC" text-anchor="middle">540° TOTAL</text>
  </g>

  <!-- Right Callout Box: Protractor Division -->
  <g transform="translate(690, 160)" filter="url(#shadow2)">
    <rect x="-85" y="-70" width="170" height="140" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.95" />
    <text x="0" y="-45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">EACH CORNER</text>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FFF" text-anchor="middle">5 Equal Angles</text>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FDE047" text-anchor="middle">540° ÷ 5</text>
    <line x1="-65" y1="20" x2="65" y2="20" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#38BDF8" text-anchor="middle">108°</text>
  </g>

  <!-- Maya Character kneeling holding protractor -->
  <g transform="translate(160, 310)" filter="url(#shadow2)">
    <!-- Hair & Head -->
    <circle cx="40" cy="35" r="24" fill="#334155" />
    <circle cx="40" cy="38" r="20" fill="#FDBA74" />
    <circle cx="34" cy="36" r="3" fill="#1E293B" />
    <circle cx="46" cy="36" r="3" fill="#1E293B" />
    <path d="M 35,46 Q 40,51 45,46" stroke="#9A3412" stroke-width="2" fill="none" />
    <path d="M 15,100 L 25,60 Q 40,58 55,60 L 65,100 Z" fill="#EC4899" />
    <!-- Protractor Tool -->
    <path d="M 50,55 A 25 25 0 0 1 100,55 Z" fill="#38BDF8" opacity="0.7" stroke="#FFF" stroke-width="2" />
  </g>

  <!-- Arjun Character watching in excitement -->
  <g transform="translate(580, 310)" filter="url(#shadow2)">
    <circle cx="40" cy="38" r="20" fill="#FED7AA" />
    <path d="M 20,22 Q 40,8 60,22 Q 53,8 40,6 Q 27,8 20,22 Z" fill="#0F172A" />
    <circle cx="34" cy="36" r="3" fill="#0F172A" />
    <circle cx="46" cy="36" r="3" fill="#0F172A" />
    <path d="M 34,46 Q 40,54 46,46" stroke="#9A3412" stroke-width="2" fill="none" />
    <path d="M 15,100 L 25,60 Q 40,58 55,60 L 65,100 Z" fill="#3B82F6" />
  </g>

  <!-- Bottom Informational Banner Card -->
  <g transform="translate(400, 445)" filter="url(#shadow2)">
    <rect x="-270" y="-30" width="540" height="56" rx="28" fill="#1E1B4B" stroke="#7C3AED" stroke-width="2" />
    <text x="0" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#C084FC" text-anchor="middle">✨ REGULAR PENTAGON INTERIOR ANGLE ✨</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#F3F4F6" text-anchor="middle">Each Interior Angle = Angle Sum ÷ n = 540° ÷ 5 = 108°</text>
  </g>
</svg>
